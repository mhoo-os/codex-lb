name: Publish isolated upgrade candidate
on:
  push:
    branches: [fix/websocket-receive-diagnostics]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish candidate only
        run: |
          image="ghcr.io/mhoo-os/codex-lb:upgrade-candidate-${GITHUB_SHA}"
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source=https://github.com/mhoo-os/codex-lb -t "$image" .
          docker push "$image"
          docker inspect --format '{{json .RepoDigests}}' "$image"
